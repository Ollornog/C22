<!-- c22-title: Kennzahlenzeile (drei Werte) -->
<!-- C22-custom: three figures side by side, label above the value, the value in tabular figures (EightPerDay,
     2026-11-17): the week, the account, the leave. In a small card, or bare with dividers between the figures. -->
<div class="c22-examples">
  <div class="c22-example">
    <span class="c22-example-label">In einer Karte (Woche, Konto, Urlaub)</span>
    <div class="card w-full max-w-md" data-size="sm">
      <section class="grid grid-cols-3 gap-2 text-center">
        <div><p class="text-muted-foreground text-xs">Saldo Woche</p><p class="font-semibold tabular-nums">+0:30</p></div><div><p class="text-muted-foreground text-xs">Zeitkonto</p><p class="font-semibold tabular-nums">+12:45</p></div><div><p class="text-muted-foreground text-xs">Urlaub</p><p class="font-semibold tabular-nums">12 / 30</p></div>
      </section>
    </div>
  </div>
  <div class="c22-example">
    <span class="c22-example-label">Ohne Karte, mit Trennlinien</span>
    <div class="grid w-full max-w-md grid-cols-3 divide-x rounded-md border text-center">
      <div class="p-3"><p class="text-muted-foreground text-xs">Saldo Woche</p><p class="font-semibold tabular-nums">−1:15</p></div><div class="p-3"><p class="text-muted-foreground text-xs">Zeitkonto</p><p class="font-semibold tabular-nums">+3:00</p></div><div class="p-3"><p class="text-muted-foreground text-xs">Urlaub</p><p class="font-semibold tabular-nums">–</p></div>
    </div>
  </div>
</div>
