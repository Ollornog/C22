<!-- custom: Tab Bar. The navigation of a phone along the bottom edge: nav.tab-bar with links (or buttons), icon above
     the label, the open one aria-current="page". Fixed to the bottom above the home indicator (safe area; the page needs
     viewport-fit=cover) and gone from md (48rem) on, where the head carries the same links; data-always keeps it at every
     width. The page keeps room below its content itself (e.g. pb-20 below md). Here each example sits in a frame with
     transform-gpu, which holds the fixed bar inside it. -->
<div class="c22-examples">
  <div class="c22-example">
    <span class="c22-example-label">Handy (ab md ausgeblendet; am Desktop daher leer)</span>
    <div class="relative h-48 w-full max-w-sm overflow-hidden rounded-lg border bg-background transform-gpu"><p class="p-4 text-muted-foreground text-sm">Inhalt der Seite</p><nav class="tab-bar" aria-label="Hauptnavigation"><a href="#" aria-current="page"><svg data-icon-lu="clock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Zeit</span></a><a href="#"><svg data-icon-lu="chart-column" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><rect width="3" height="6" x="7" y="12"/><rect width="3" height="10" x="12" y="8"/><rect width="3" height="14" x="17" y="4"/></svg><span>Berichte</span></a><a href="#"><svg data-icon-lu="user" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Konto</span></a></nav></div>
  </div>
  <div class="c22-example">
    <span class="c22-example-label">Immer sichtbar (data-always), vier Ziele</span>
    <div class="relative h-48 w-full max-w-sm overflow-hidden rounded-lg border bg-background transform-gpu"><p class="p-4 text-muted-foreground text-sm">Inhalt der Seite</p><nav class="tab-bar" aria-label="Hauptnavigation" data-always><a href="#"><svg data-icon-lu="house" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Start</span></a><a href="#" aria-current="page"><svg data-icon-lu="clock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Zeit</span></a><a href="#"><svg data-icon-lu="calendar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>Kalender</span></a><a href="#"><svg data-icon-lu="user" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Konto</span></a></nav></div>
