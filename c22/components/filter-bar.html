<!-- C22-custom: Filter bar. Filter groups (section + heading), each filter shows sign and count with
     the text below it, so no separate legend is needed. Pressed = line + underline in primary, not
     colour alone. Buttons toggle aria-pressed through c22.js (`data-single` on a section releases the
     others) and fire `c22:filter`; links (server filters) carry aria-current="true" and are followed. -->
<div class="c22-examples">
  <div class="c22-example">
    <span class="c22-example-label">Gruppen, mehrere gleichzeitig (<code>button[aria-pressed]</code>)</span>
    <div class="filter-bar" role="toolbar" aria-label="Filter">
      <section aria-labelledby="c22-fb-a">
        <h3 id="c22-fb-a">Fristen</h3>
        <div>
          <button type="button" aria-pressed="true"><span><svg data-icon-lu="clock-alert" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><path d="M20 12v5"/><path d="M20 21h.01"/><path d="M21.25 8.2A10 10 0 1 0 16 21.16"/></svg>196</span><small>Überfällig</small></button>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="clock" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>310</span><small>Bald fällig</small></button>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="clipboard-check" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>64</span><small>Abnahme</small></button>
        </div>
      </section>
      <section aria-labelledby="c22-fb-b">
        <h3 id="c22-fb-b">Mängel</h3>
        <div>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="circle-x" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>32</span><small>Kritisch</small></button>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="triangle-alert" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>209</span><small>Offen</small></button>
        </div>
      </section>
      <section aria-labelledby="c22-fb-c">
        <h3 id="c22-fb-c">Sonst</h3>
        <div>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="circle-check" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>2.168</span><small>In Ordnung</small></button>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="bookmark" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg>63</span><small>Entwurf</small></button>
        </div>
      </section>
    </div>
  </div>
  <div class="c22-example">
    <span class="c22-example-label">Nur einer je Gruppe (<code>data-single</code>)</span>
    <div class="filter-bar" role="toolbar" aria-label="Filter">
      <section aria-labelledby="c22-fb-d" data-single>
        <h3 id="c22-fb-d">Prüfungen</h3>
        <div>
          <button type="button" aria-pressed="true"><span><svg data-icon-lu="pencil" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>16</span><small>Angefangen</small></button>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="message-square" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg>7</span><small>Beanstandet</small></button>
          <button type="button" aria-pressed="false"><span><svg data-icon-lu="lock" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>530</span><small>Abgeschlossen</small></button>
        </div>
      </section>
    </div>
  </div>
  <div class="c22-example">
    <span class="c22-example-label">Als Links für Server-Filter (<code>a[aria-current]</code>)</span>
    <div class="filter-bar" role="navigation" aria-label="Filter">
      <section aria-labelledby="c22-fb-e">
        <h3 id="c22-fb-e">Ansicht</h3>
        <div>
          <a href="#" aria-current="true"><span><svg data-icon-lu="door-closed" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h.01"/><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/></svg>3.073</span><small>Alle</small></a>
          <a href="#" ><span><svg data-icon-lu="clock-alert" class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><path d="M20 12v5"/><path d="M20 21h.01"/><path d="M21.25 8.2A10 10 0 1 0 16 21.16"/></svg>196</span><small>Überfällig</small></a>
        </div>
      </section>
    </div>
  </div>
</div>
