# REUSE 3.3 (FSFE) — Nachweis fuer die Demo-Bilder der Galerie.
#
# WARUM DIESE DATEI UND NICHT EINE COMMIT-MESSAGE (PO-Regel 2026-09-23,
# context/fremdressourcen.md): Eine Commit-Message stirbt beim ersten Repo-Umzug, und
# IPTC/XMP in der Datei selbst ueberlebt keine Bildoptimierung. Der Nachweis gehoert
# NEBEN die Datei. Bei vielen Dateien eine REUSE.toml statt je Bild ein .license-Sidecar.
#
# WARUM DIE BILDER UEBERHAUPT HIER LIEGEN: Bis 2026-09-23 wurden sie von
# dem Bild-CDN des Anbieters nachgeladen — 116 Stellen in 20 Dateien. Damit uebertrug jeder
# Aufruf der oeffentlichen Galerie die IP des Besuchers an einen Dritten, ohne Klick.
# Schwerer noch: C22 vererbt sein Markup an jede App, ein Hotlink hier wird zu einem
# Hotlink in jeder App, die einen Block abschreibt.
#
# WARUM DAS URHEBERRECHTLICH TRAEGT: Die Unsplash-Lizenz erlaubt Herunterladen, Kopieren
# und Verwenden ausdruecklich, auch kommerziell. Das ist der EINFACHE Fall.
# ⚠️ Er ist nicht der allgemeine: EuGH C-161/17 (Renckhoff, 07.08.2018) — ein frei
# abrufbares Foto auf den eigenen Server zu stellen ist eine erneute oeffentliche
# Wiedergabe und braucht die Erlaubnis des Rechteinhabers. "War frei im Netz" traegt
# nicht, und eine Quellenangabe ersetzt kein Nutzungsrecht (§ 31 UrhG). Wer diese
# Loesung auf andere Bilder uebertraegt, prueft zuerst die Lizenz.
#
# Eine Datei je Bild und Seitenverhaeltnis (31 statt 55), jeweils in der groessten
# gebrauchten Aufloesung — die Anzeigegroesse kommt aus CSS, nicht aus der Datei.
version = 1

[[annotations]]
path = "*.jpg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Unsplash contributors, https://unsplash.com — abgerufen am 2026-09-23"
SPDX-License-Identifier = "LicenseRef-Unsplash"
SPDX-FileComment = "Demo-Bilder der C22-Galerie. Quelle: das Bild-CDN von Unsplash; die photo-id steht im Dateinamen. Unsplash-Lizenz: Herunterladen, Kopieren und Verwenden erlaubt, auch kommerziell; Weiterverkauf als Bildarchiv nicht."
