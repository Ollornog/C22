name: CI

# Feature-Branches laufen bewusst ohne CI — dort ist `ci-local` das Sicherheitsnetz.
# Das Gate sind Pull Requests und main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Auf main NICHT abbrechen: dort haengt am Lauf das Abbild bzw. der Required Check,
  # und ein abgebrochener main-Commit hat hinterher keines. Genau das ist passiert —
  # paperlaiss verlor am 2026-09-21 vier main-Laeufe innerhalb von 33 Sekunden,
  # DashMyBoard drei am 2026-07-10. Auf Feature-Branches bleibt der Abbruch richtig:
  # dort zaehlt nur der letzte Stand.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    # Öffentliches Repo ⇒ GitHub-Runner. Self-hosted Runner sind hier tabu: ein Fork-PR
    # würde fremden Workflow-Code auf eigener Hardware ausführen.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Die letzten drei stable Minors — gefuehrt in repokit
        # (tests/_kit/python_matrix.json) und im Abbild ci-python-web.
        # 3.10 fiel am 2026-09-22 raus (EOL 31.10.2026).
        python: ["3.13", "3.14", "3.15"]

    steps:
      # `persist-credentials: false` ist EIGENE Härtung, kein belegter Standard — GitHub
      # empfiehlt es nirgends ausdrücklich. Seit checkout@v6 liegt das Token in
      # $RUNNER_TEMP statt in .git/config; es zählt dort, wo nach dem Checkout FREMDER
      # Code läuft — hier `pip install -e` und die Suite. Kein Job dieses Repos pusht
      # selbst, deshalb braucht es nirgends eine Ausnahme.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Abhängigkeiten
        run: pip install -e ".[dev]"

      # The browser suite builds the site. Fetched here, before the snapshot below, because the
      # binary is ignored but counts for the residue check.
      # Cache of the binary (one file per version, checked against the pinned SHA256 before use): a 504 from
      # github.com releases turned PRs red (2026-11-09). Key = the script, which pins version and checksum.
      - name: Tailwind-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/c22-tailwind
          key: c22-tailwind-${{ hashFiles('scripts/fetch-tailwind.sh') }}

      - name: Tailwind-CLI holen
        run: TAILWIND_CACHE="$HOME/.cache/c22-tailwind" ./scripts/fetch-tailwind.sh

      # Der Vorher-Stand macht den Rückstands-Check unten ENTSCHEIDBAR. Er muss NACH
      # der Installation liegen: `pip install -e` erzeugt `*.egg-info`, und ohne diesen
      # Schritt wäre das ein Rückstand, den der Check der Suite zuschreibt.
      - name: Vorher-Stand des Baums
        run: ./scripts/_residue_check.sh snapshot > "$RUNNER_TEMP/baum-vorher.txt"

      - name: Suite (Fach + Hygiene + Browser)
        run: ./scripts/check.sh
        env:
          C22_VISUAL_OUT: ${{ runner.temp }}/visual

      - name: Wiederholbarkeit — dieselbe Suite ein zweites Mal
        run: ./scripts/check.sh
        env:
          C22_VISUAL_OUT: ${{ runner.temp }}/visual

      # A red picture says nothing in a log: the capture and the marked difference stay available.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: visual-${{ matrix.python }}
          path: ${{ runner.temp }}/visual
          if-no-files-found: ignore

      # Dieselbe Prüfung, die der pre-push-Hook fährt.
      - name: Arbeitsverzeichnis ist unverändert geblieben
        run: ./scripts/_residue_check.sh check --seit "$RUNNER_TEMP/baum-vorher.txt"
