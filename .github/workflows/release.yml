name: release

# Ein Git-Tag `vX.Y.Z` erzeugt ein GitHub-Release mit Wheel, sdist und Prüfsummen.
# C22 ist eine reine Asset-/Python-Bibliothek — KEIN Container-Abbild (das braucht nur ein Dienst).
# Der Verteilweg: C22 aktualisiert sich nicht selbst, es wird per gepinntem Tag, Wheel oder
# release-Tarball eingebunden — die CSS/JS-Dateien liegen in beiden Artefakten.
#
# Vorher prüft der Job, dass der Tag zur Version im Paket passt. Ein Release mit falscher
# Versionsnummer ist schlimmer als keins: es ist unauffällig falsch.

# `workflow_dispatch` ist der TROCKENLAUF und seit 2026-09-24 auch einer: Bis dahin gab es den
# Knopf, aber jeder Druck darauf wäre am Tag-Vergleich gescheitert (`GITHUB_REF_NAME` ist dann ein
# Branch) — und wäre er es nicht, hätte er aus einem Branch heraus ein Release angelegt. Ein
# Notausgang, der beim Öffnen klemmt oder ins Freie führt, ist keiner.
#
# Warum überhaupt: ein Workflow mit `on: push: tags` wird von der normalen CI NIE berührt. Er sieht
# gepflegt aus, weil das Repo grün ist — das Grün kommt aber von einem anderen Workflow. So lief
# TinySesams erster Tag nach zwei Monaten rot, weil dem Release-Job Bau-Abhängigkeiten fehlten.
# Jetzt: alles bis zum Bau läuft auch beim Trockenlauf, nur das Veröffentlichen hängt am Tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # nur dieser Job schreibt: Release anlegen und Dateien anhängen
    steps:
      # `persist-credentials: false` ist EIGENE Härtung, kein belegter Standard (siehe
      # ci.yml). Auch dieser Job pusht nichts: `gh release create` benutzt GH_TOKEN,
      # nicht die git-Credentials im Arbeitsbaum.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag gegen die Paketversion prüfen
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu pyproject-Version $pkg" >&2
            exit 1
          fi
          echo "Tag und Paketversion stimmen überein: $pkg"

      # Ohne Tag gibt es nichts zu vergleichen — geprüft wird, was prüfbar ist: dass die
      # Paketversion im CHANGELOG steht. Der Schritt ist damit nicht bloß übersprungen.
      - name: Trockenlauf — Version und CHANGELOG
        if: github.ref_type != 'tag'
        run: |
          pkg="$(python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "Trockenlauf ohne Tag. Paketversion: $pkg"
          grep -q "\[$pkg\]" CHANGELOG.md \
            || { echo "CHANGELOG kennt Version $pkg nicht" >&2; exit 1; }
          echo "CHANGELOG kennt $pkg — bereit für den Tag v$pkg"

      - name: Suite fahren, bevor irgendetwas veröffentlicht wird
        run: python tests/run_all.py --no-browser

      - name: Pakete bauen
        run: |
          pip install build
          python -m build                       # erzeugt dist/*.whl und dist/*.tar.gz (beide mit den Assets)

      - name: Prüfsummen
        run: cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      # Bewusst `gh` statt einer Dritt-Action: die bräuchte `contents: write` auf dieses Repo,
      # und ihr Tag ließe sich umhängen. `gh` ist auf den Runnern vorinstalliert.
      # ⚠️ NUR beim Tag. Ohne diese Bedingung legte ein Trockenlauf aus einem Branch heraus ein
      # Release an; bis dahin hing das allein an `--verify-tag`, also an einem Nebeneffekt.
      - name: Release anlegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
